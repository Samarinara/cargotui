[package]
name = "cargotui"
version = "0.1.0"
edition = "2024"
authors = ["Sam Katevatis"]
description = "A TUI for managing rust projects"
license-file = "LICENSE.txt"
keywords = ["TUI", "tui", "cargo", "cli", "package-manager"]
categories = ["tui", "command-line-utilities", "development-tools"]

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
tokio = { version = "1", features = ["full"] }
toml = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
proptest = "1"
tempfile = "3"
